name: Deploy to VPS

# Runs when the published site files change on main, or manually from the Actions tab.
# The SSH key stored in DEPLOY_SSH_KEY can only run /usr/local/bin/bassamailab-deploy
# on the server (forced command), so this job cannot do anything else there.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
  workflow_dispatch:

concurrency:
  group: deploy-bassamailab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Diagnostics only (no key material): size, line count, first 12 chars
          # (a fixed, non-secret header) and a short hash of the whitespace-stripped value.
          STRIPPED="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d ' \t\r\n')"
          echo "::notice title=Key secret check::chars=$(printf '%s' "$DEPLOY_SSH_KEY" | wc -c) lines=$(printf '%s\n' "$DEPLOY_SSH_KEY" | wc -l) stripped=${#STRIPPED} starts=${STRIPPED:0:12} sha=$(printf '%s' "$STRIPPED" | sha256sum | cut -c1-16)"
          # DEPLOY_SSH_KEY may be the PEM key itself or a single-line base64 of it
          # (base64 is safer to copy from a terminal). Stray CR/spaces are removed.
          if printf '%s' "$DEPLOY_SSH_KEY" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key — re-copy it"
            exit 1
          fi
          echo "::notice title=Key fingerprint::$(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              deploy@161.97.99.78 "$GITHUB_SHA"

      - name: Verify from the public internet
        run: |
          sleep 2
          for u in / /assets/og-image.jpg /assets/favicon.svg /assets/fursan-preview.webp /assets/dinner-preview.webp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://bassamailab.xyz$u")
            echo "$code  $u"
            [ "$code" = 200 ] || exit 1
          done
          curl -s --max-time 15 https://bassamailab.xyz/ | grep -q 'og:image'
          echo "Deployed $GITHUB_SHA"
